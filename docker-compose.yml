services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - KUBECONFIG_PATH=/root/.kube/config
    volumes:
      # Give the container read-only access to your local kubeconfig so
      # kubectl inside it can reach your cluster. Note: a cluster whose
      # kubeconfig points at localhost/127.0.0.1 (minikube, kind, Docker
      # Desktop) is not reachable from inside a container — run the
      # backend locally with uvicorn for those setups.
      - ${HOME}/.kube:/root/.kube:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
