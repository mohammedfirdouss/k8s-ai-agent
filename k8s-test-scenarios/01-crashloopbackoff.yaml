# Scenario 1 — CrashLoopBackOff caused by a missing environment variable.
# The container exits immediately because DATABASE_URL is not set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL environment variable is missing"
                echo "payment-service cannot start without a database connection"
                exit 1
              fi
              sleep 3600
