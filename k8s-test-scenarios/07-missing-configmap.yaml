# Scenario 7 — CreateContainerConfigError: the container loads its
# environment from a ConfigMap that was never created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef:
                name: notification-config   # WRONG — does not exist
