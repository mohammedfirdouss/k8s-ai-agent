# Scenario 6 — Pending pod: requests 64 CPUs, more than any node has, so the
# scheduler can never place it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  labels:
    app: report-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "64"   # WRONG — far beyond node capacity
              memory: 64Mi
