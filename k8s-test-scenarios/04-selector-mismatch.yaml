# Scenario 4 — Service selector mismatch: the service selects
# app=orders-api but the pods are labeled app=orders-service,
# so the service has no endpoints and traffic gets 503s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: default
  labels:
    app: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: default
spec:
  selector:
    app: orders-api   # WRONG — pods are labeled app=orders-service
  ports:
    - port: 80
      targetPort: 80
